<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mirror App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Default Mirror Effect */
      transition: transform 0.3s ease;
    }
    video.unflipped {
      transform: scaleX(1);
    }
    /* Controls Bar */
    .controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px 24px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      outline: none;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.4);
    }
    .btn-capture {
      width: 65px;
      height: 65px;
      background: #fff;
      color: #000;
      font-size: 24px;
    }
    /* Light Overlay for Low-Light Mode */
    .light-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 100px 50px rgba(255, 255, 255, 0.9);
      pointer-events: none;
      display: none;
      z-index: 5;
    }
    .light-active {
      display: block;
    }
    /* Freeze Photo Modal */
    .photo-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    .photo-modal img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .close-btn {
      position: absolute;
      top: 40px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="lightOverlay" class="light-overlay"></div>
    <video id="webcam" autoplay playsinline></video>
    
    <div class="controls">
      <button class="btn" id="toggleFlip" title="Flip View">🔄</button>
      <button class="btn btn-capture" id="captureBtn" title="Take Photo">📸</button>
      <button class="btn" id="toggleLight" title="Screen Light">💡</button>
    </div>
  </div>

  <!-- Captured Photo View -->
  <div class="photo-modal" id="photoModal">
    <button class="close-btn" id="closeModal">✕ Back</button>
    <img id="capturedImage" alt="Captured Mirror Photo">
  </div>

  <script>
    const video = document.getElementById('webcam');
    const captureBtn = document.getElementById('captureBtn');
    const toggleFlipBtn = document.getElementById('toggleFlip');
    const toggleLightBtn = document.getElementById('toggleLight');
    const lightOverlay = document.getElementById('lightOverlay');
    const photoModal = document.getElementById('photoModal');
    const capturedImage = document.getElementById('capturedImage');
    const closeModal = document.getElementById('closeModal');

    let isFlipped = true;

    // Camera Access Start (Front Camera Preferred)
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert('Camera Access Denied or Not Supported: ' + err.message);
      }
    }

    // Toggle Mirror Flip
    toggleFlipBtn.addEventListener('click', () => {
      isFlipped = !isFlipped;
      if (isFlipped) {
        video.classList.remove('unflipped');
      } else {
        video.classList.add('unflipped');
      }
    });

    // Screen Flashlight / Light Mode Toggle
    toggleLightBtn.addEventListener('click', () => {
      lightOverlay.classList.toggle('light-active');
    });

    // Capture Image (Freeze View)
    captureBtn.addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      if (isFlipped) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      capturedImage.src = canvas.toDataURL('image/png');
      photoModal.style.display = 'flex';
    });

    // Close Photo View
    closeModal.addEventListener('click', () => {
      photoModal.style.display = 'none';
    });

    // Start on load
    startCamera();
  </script>
</body>
</html>
