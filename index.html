<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance WalletConnect Integration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0e11;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #1e2329;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            width: 320px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin: 12px 0;
            background-color: #f0b90b;
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3 style="color: #f0b90b;">Binance Web3 Connect</h3>
        
        <!-- WalletConnect Scheme Button -->
        <button id="openBinanceBtn" class="btn">Connect via Binance</button>
    </div>

    <script>
        document.getElementById('openBinanceBtn').addEventListener('click', function() {
            // Step 1: WalletConnect URI (Ye aapke Backend/SDK se generate hota hai)
            var rawWcUri = "wc:8a7070a235ae6b0d948... (Aapka Full WC URI)";
            
            // Step 2: WC URI ko encode karein
            var encodedWcUri = encodeURIComponent(rawWcUri);
            
            // Step 3: Binance Deep Link URL banayein
            var binanceDeepLink = "bnc://app.binance.com/wc?uri=" + encodedWcUri;
            
            // Redirect to Binance
            window.location.href = binanceDeepLink;
        });
    </script>

</body>
</html>
