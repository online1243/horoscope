<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance WalletConnect</title>
    <style>
        body {
            background-color: #0b0e11;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #1e2329;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }
        .btn {
            background: #f0b90b;
            color: #000;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="box">
    <h3 style="color: #f0b90b;">Connect Binance</h3>
    <button class="btn" onclick="connectBinance()">Open in Binance App</button>
</div>

<script>
function connectBinance() {
    // 1. Aapka dynamic WC URI (Jo WalletConnect Server generate karke deta hai)
    // Example format: wc:7f6e...@2?symKey=...&relay-protocol=irn
    let activeWcUri = "https://google.com"; 

    if(!activeWcUri || activeWcUri === "YOUR_DYNAMIC_WALLETCONNECT_URI_HERE") {
        alert("Pehle WalletConnect SDK se active URI generate karein!");
        return;
    }

    // 2. URI Ko Encoded format me convert karein
    let encodedUri = encodeURIComponent(activeWcUri);

    // 3. Binance App Deep Link
    let binanceUrl = "bnc://app.binance.com/wc?uri=" + encodedUri;

    // Direct Redirect
    window.location.href = binanceUrl;
}
</script>

</body>
</html>
