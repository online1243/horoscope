<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS / Android Immersion Flags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <title>⚡ APP STRESS TEST & VIEWPORT DESTROYER</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        html, body {
            width: 100vw;
            min-height: 500vh; /* Massive Height for Scroll Collapse */
            background-color: #05050a;
            color: #00ffcc;
            font-family: monospace;
            overflow-x: hidden;
        }

        /* Floating Controls Over Anything */
        .stress-panel {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999999 !important;
            background: rgba(255, 0, 85, 0.9);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.8);
            width: 90%;
            max-width: 400px;
        }

        .btn-nuke {
            background: #000;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 12px 20px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-nuke:active {
            background: #00ffcc;
            color: #000;
        }

        /* Heavy Stress Box Container */
        .stress-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 204, 0.2);
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        #canvas-flood {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            opacity: 0.15;
        }
    </style>
</head>
<body>

    <canvas id="canvas-flood"></canvas>

    <div class="stress-panel">
        <h3>🔥 APP STRESS ENGINE 🔥</h3>
        <p id="status">Status: Waiting for User Trigger...</p>
        <button class="btn-nuke" id="nuke-btn">START NUKE ATTACK 🚀</button>
    </div>

    <!-- Long Dummy DOM Structure for Scroll Overload -->
    <div style="margin-top: 150px;" id="dom-target"></div>

    <script>
        const statusEl = document.getElementById('status');
        const nukeBtn = document.getElementById('nuke-btn');
        let isNuking = false;

        // 1. DUMMY DOM FLOODER (Viewport me heavy DOM Nodes inject karna)
        const domTarget = document.getElementById('dom-target');
        for (let i = 1; i <= 80; i++) {
            const box = document.createElement('div');
            box.className = 'stress-box';
            box.id = `box-${i}`;
            box.innerHTML = `<h4>Stress Node #${i}</h4><p>Testing scroll & touch injection resilience on node ${i}...</p>`;
            domTarget.appendChild(box);
        }

        // 2. FAKE TOUCH & SWIPE EVENT FLOODER
        function injectFakeGestures() {
            const targets = [document.body, window, document.documentElement];
            
            targets.forEach(target => {
                // Synthetic Touch Start
                const tStart = new Touch({
                    identifier: Date.now(),
                    target: target,
                    clientX: window.innerWidth / 2,
                    clientY: 800,
                    pageY: 800 + window.scrollY
                });
                
                // Synthetic Touch Move (Massive Upward Drag)
                const tMove = new Touch({
                    identifier: Date.now(),
                    target: target,
                    clientX: window.innerWidth / 2,
                    clientY: 10,
                    pageY: 10 + window.scrollY
                });

                target.dispatchEvent(new TouchEvent('touchstart', { touches: [tStart], targetTouches: [tStart], changedTouches: [tStart], bubbles: true }));
                target.dispatchEvent(new TouchEvent('touchmove', { touches: [tMove], targetTouches: [tMove], changedTouches: [tMove], bubbles: true }));
                target.dispatchEvent(new TouchEvent('touchend', { touches: [], targetTouches: [], changedTouches: [tMove], bubbles: true }));

                // Synthetic Wheel Event (Desktop/Native Mouse emulation)
                target.dispatchEvent(new WheelEvent('wheel', { deltaY: 500, bubbles: true }));
                
                // Synthetic Keyboard Down (PageDown & Space Key Spammers)
                target.dispatchEvent(new KeyboardEvent('keydown', { key: 'PageDown', keyCode: 34, bubbles: true }));
                target.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', keyCode: 32, bubbles: true }));
            });
        }

        // 3. LAYOUT THRASHING & HARDWARE SCROLL AGGRESSOR
        function loopStressEngine() {
            if (!isNuking) return;

            // Scroll Spammer (Combination of different scroll APIs)
            window.scrollBy(0, 45);
            window.scrollTo(0, window.scrollY + 20);

            // iOS Scroll Hack (1px jitter to force browser URL bar recalculation)
            if (window.scrollY % 2 === 0) {
                window.scrollTo(0, window.scrollY - 1);
            }

            // Inject Synthetic Touch Bomb
            injectFakeGestures();

            // Dynamic Body Padding Shift (Calculates WebKit Viewport Bounds)
            document.body.style.paddingBottom = (Math.random() * 50) + 'px';

            requestAnimationFrame(loopStressEngine);
        }

        // 4. HEAVY CANVAS COMPUTATION (App WebGL/Rendering Thread Test)
        const canvas = document.getElementById('canvas-flood');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function renderCanvasChaos() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for(let i=0; i<30; i++) {
                ctx.fillStyle = `#${Math.floor(Math.random()*16777215).toString(16)}`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 50, 50);
            }
            requestAnimationFrame(renderCanvasChaos);
        }
        renderCanvasChaos();

        // 5. TRIGGER NUKE ATTACK ON USER TAP
        function startNuke() {
            isNuking = true;
            statusEl.innerText = "💣 NUKE ATTACK ACTIVE! Bombarding WebView...";
            statusEl.style.color = "#ffff00";

            // Fullscreen API Force Request (Web API Fallback)
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen().catch(()=>{});
            else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen().catch(()=>{});

            // Start Main Aggressor Loop
            requestAnimationFrame(loopStressEngine);
        }

        nukeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startNuke();
        });

        // Global Event Trigger (Pehle kisi bhi touch par trigger)
        ['touchstart', 'pointerdown', 'click'].forEach(evt => {
            document.addEventListener(evt, function initNuke() {
                startNuke();
                document.removeEventListener(evt, initNuke);
            }, { once: true });
        });
    </script>
</body>
</html>
