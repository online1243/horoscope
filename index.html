<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            user-select: none;
        }

        .container {
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 1.5rem;
        }

        .btn {
            background: #00c6ff;
            background: linear-gradient(to right, #0072ff, #00c6ff);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="status-title">Full Screen App</h1>
        <p id="status-text">Kahin bhi click karo fullscreen karne ke liye.</p>
        <button class="btn" onclick="toggleFullScreen()">Full Screen Toggle</button>
    </div>

    <script>
        function openFullScreen() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        function closeFullScreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                openFullScreen();
            } else {
                closeFullScreen();
            }
        }

        // Screen par kahin bhi pehli click karte hi full screen ho jayega
        document.addEventListener('click', function autoFullScreen() {
            if (!document.fullscreenElement) {
                openFullScreen();
            }
        }, { once: true });

        // Fullscreen state detect karke UI update karna
        document.addEventListener('fullscreenchange', updateUI);
        document.addEventListener('webkitfullscreenchange', updateUI);

        function updateUI() {
            const title = document.getElementById('status-title');
            const text = document.getElementById('status-text');
            if (document.fullscreenElement) {
                title.innerText = "Full Screen Active!";
                text.innerText = "Exit karne ke liye ESC dabayein ya button par click karein.";
            } else {
                title.innerText = "Full Screen App";
                text.innerText = "Kahin bhi click karo fullscreen karne ke liye.";
            }
        }
    </script>
</body>
</html>
