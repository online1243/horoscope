<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Binance App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0e11;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #1e2329;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            width: 300px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin: 10px 0;
            background-color: #f0b90b; /* Binance Yellow */
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3 style="color: #f0b90b;">Open Binance</h3>
        
        <!-- Option 1: Official Deep Link Scheme -->
        <a href="bnc://app.binance.com/webview/webview?url=https://google.com/1" class="btn">
            Open App (Option 1)
        </a>

        <!-- Option 2: Webview Direct Scheme -->
        <a href="binance://app?url=https://google.com/1" class="btn">
            Open App (Option 2)
        </a>

        <!-- Option 3: Universal Link -->
        <a href="https://app.binance.com/en/webview/webview?url=https://google.com/1" class="btn">
            Open App (Option 3 - Universal Link)
        </a>
    </div>

</body>
</html>
