<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Photo Capture</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 500px;
      width: 100%;
    }
    video, canvas {
      width: 100%;
      border-radius: 8px;
      background-color: #222;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    canvas {
      display: none;
    }
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    #startBtn {
      background-color: #007bff;
      color: white;
    }
    #startBtn:hover {
      background-color: #0056b3;
    }
    #snapBtn {
      background-color: #28a745;
      color: white;
    }
    #snapBtn:hover {
      background-color: #1e7e34;
    }
    #snapBtn:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Camera Capture</h2>
    
    <!-- Video Preview -->
    <video id="video" autoplay playsinline></video>
    
    <!-- Hidden Canvas used for taking photo -->
    <canvas id="canvas"></canvas>

    <div class="controls">
      <button id="startBtn">Camera Chalu Karein</button>
      <button id="snapBtn" disabled>Photo Khinchein</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startBtn = document.getElementById('startBtn');
    const snapBtn = document.getElementById('snapBtn');

    // Camera access request
    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, 
          audio: false 
        });
        video.srcObject = stream;
        snapBtn.disabled = false;
        startBtn.disabled = true;
      } catch (err) {
        alert("Camera access permit nahi hua ya device me camera nahi mila: " + err.message);
      }
    });

    // Capture photo from video stream
    snapBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const context = canvas.getContext('2d');
      
      // Canvas par frame draw karna
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // Captured image display aur download prompt
      const imageData = canvas.toDataURL('image/png');
      const downloadLink = document.createElement('a');
      downloadLink.href = imageData;
      downloadLink.download = 'captured-photo.png';
      downloadLink.click();
    });
  </script>

</body>
</html>
