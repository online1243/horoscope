<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dApp - Silent Balance Check</title>
    <!-- Ethers.js v6 Library (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            word-wrap: break-word;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        .info {
            background-color: #334155;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        span { font-weight: bold; color: #4ade80; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Web3 Silent Tracker</h2>
        
        <div class="info">
            <p style="margin: 5px 0;"><strong>Address:</strong></p>
            <span id="address">Detecting...</span>
        </div>

        <div class="info">
            <p style="margin: 5px 0;"><strong>Balance:</strong></p>
            <span id="balance">Detecting...</span>
        </div>
    </div>

    <script>
        window.addEventListener('load', async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const provider = new ethers.BrowserProvider(window.ethereum);

                    // FIRSE SIRF SILENT REQUEST (No Popup)
                    const accounts = await provider.send("eth_accounts", []);

                    if (accounts.length > 0) {
                        const userAddress = accounts[0];

                        // Balance fetch
                        const rawBalance = await provider.getBalance(userAddress);
                        const formattedBalance = ethers.formatEther(rawBalance);

                        document.getElementById('address').innerText = userAddress;
                        document.getElementById('balance').innerText = parseFloat(formattedBalance).toFixed(4) + " Native Token";
                    } else {
                        // Agar user ne app connect nahi ki hai toh popup ke bajaye ye msg dikhega
                        document.getElementById('address').innerText = "Not Connected (No Popup Triggered)";
                        document.getElementById('balance').innerText = "0";
                    }
                } catch (error) {
                    console.error("Error reading wallet details:", error);
                    document.getElementById('address').innerText = "Error Reading Wallet";
                    document.getElementById('balance').innerText = "0";
                }
            } else {
                document.getElementById('address').innerText = "Web3 Wallet Not Found";
                document.getElementById('balance').innerText = "N/A";
            }
        });
    </script>
</body>
</html>
