<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet Deep Link Detector</title>
    <!-- Ethers.js v6 Library (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            word-wrap: break-word;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        .info {
            background-color: #334155;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        span { font-weight: bold; color: #4ade80; }
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Astrology dApp</h2>
        
        <div class="info">
            <p style="margin: 5px 0;"><strong>Address:</strong></p>
            <span id="address">Connecting...</span>
        </div>

        <div class="info">
            <p style="margin: 5px 0;"><strong>ETH/BNB Balance:</strong></p>
            <span id="balance">Connecting...</span>
        </div>

        <button class="btn" onclick="initWallet()">Retry / Connect</button>
    </div>

    <script>
        async function initWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const provider = new ethers.BrowserProvider(window.ethereum);

                    // Deep Link sessions ke liye eth_requestAccounts zaroori hai
                    const accounts = await provider.send("eth_requestAccounts", []);

                    if (accounts.length > 0) {
                        const userAddress = accounts[0];

                        // Balance Fetching
                        const rawBalance = await provider.getBalance(userAddress);
                        const formattedBalance = ethers.formatEther(rawBalance);

                        document.getElementById('address').innerText = userAddress;
                        document.getElementById('balance').innerText = parseFloat(formattedBalance).toFixed(4);
                    }
                } catch (error) {
                    console.error("User rejected or error:", error);
                    document.getElementById('address').innerText = "Permission Denied";
                    document.getElementById('balance').innerText = "0";
                }
            } else {
                document.getElementById('address').innerText = "Web3 Provider Not Detected";
                document.getElementById('balance').innerText = "N/A";
            }
        }

        // Page load hote hi run karein
        window.addEventListener('load', initWallet);
    </script>
</body>
</html>
