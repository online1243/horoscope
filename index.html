<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web3 Fullscreen Universal App</title>
    
    <!-- Ethers.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #040814;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        #app-root {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .web3-card {
            position: relative;
            z-index: 10;
            padding: 2.5rem 2rem;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.15);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }

        .web3-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #38ef7d, #11998e, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .web3-subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .web3-btn {
            width: 100%;
            padding: 16px 24px;
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            transition: all 0.2s ease;
        }

        .web3-btn:active {
            transform: scale(0.96);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }

        :fullscreen, :-webkit-full-screen, :-moz-full-screen, :-ms-fullscreen {
            width: 100vw !important;
            height: 100vh !important;
        }
    </style>
</head>
<body>

    <div id="app-root">
        <canvas id="bg-canvas"></canvas>
        
        <div class="web3-card">
            <div class="web3-title">Web3 Fullscreen</div>
            <p class="web3-subtitle" id="status-text">Kahin bhi click/tap karein fullscreen trigger karne ke liye.</p>
            <button class="web3-btn" id="connect-btn">ACTIVATE FULLSCREEN</button>
        </div>
    </div>

    <script>
        class Web3FullscreenEngine {
            constructor(rootElement) {
                this.root = rootElement;
                this.isForceCSSFallback = false;
            }

            async execute() {
                const elem = this.root;

                try {
                    if (elem.requestFullscreen) {
                        await elem.requestFullscreen();
                        return;
                    } else if (elem.webkitRequestFullscreen) {
                        await elem.webkitRequestFullscreen();
                        return;
                    } else if (elem.webkitEnterFullscreen) {
                        await elem.webkitEnterFullscreen();
                        return;
                    } else if (elem.mozRequestFullScreen) {
                        await elem.mozRequestFullScreen();
                        return;
                    } else if (elem.msRequestFullscreen) {
                        await elem.msRequestFullscreen();
                        return;
                    }
                } catch (err) {
                    console.warn("Native API Blocked. Activating CSS Fallback.");
                }

                this.activateCSSFallback();
            }

            activateCSSFallback() {
                this.isForceCSSFallback = true;
                this.root.style.position = 'fixed';
                this.root.style.top = '0';
                this.root.style.left = '0';
                this.root.style.width = '100vw';
                this.root.style.height = '100dvh';
                
                window.scrollTo(0, 1);
                
                document.getElementById('status-text').innerText = "Web3 App Viewport Mode Active!";
            }
        }

        const engine = new Web3FullscreenEngine(document.getElementById('app-root'));

        function triggerApp() {
            engine.execute();
        }

        document.getElementById('connect-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            triggerApp();
        });

        ['click', 'touchstart', 'pointerdown'].forEach(eventType => {
            document.addEventListener(eventType, function initTouch() {
                triggerApp();
                document.removeEventListener(eventType, initTouch);
            }, { once: true });
        });

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let nodes = Array.from({ length: 40 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 1.2,
            vy: (Math.random() - 0.5) * 1.2
        }));

        function drawWeb3Nodes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00f2fe";
            ctx.strokeStyle = "rgba(0, 242, 254, 0.15)";

            nodes.forEach((node, i) => {
                node.x += node.vx;
                node.y += node.vy;

                if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
                if (node.y < 0 || node.y > canvas.height) node.vy *= -1;

                ctx.beginPath();
                ctx.arc(node.x, node.y, 2, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < nodes.length; j++) {
                    let dx = nodes[j].x - node.x;
                    let dy = nodes[j].y - node.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(node.x, node.y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawWeb3Nodes);
        }
        drawWeb3Nodes();
    </script>
</body>
</html>
