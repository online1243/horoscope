<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ultimate Floating Overlay Buttons</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            /* Scroll test ke liye continuous height */
            min-height: 200vh; 
            padding: 80px 20px;
        }

        /* -------------------------------------------------------------
           1. TOP FLOATING BUTTON (Sabse Upar Top Par Float Karega)
        ------------------------------------------------------------- */
        .float-btn-top {
            position: fixed;
            top: env(safe-area-inset-top, 15px); /* iOS Notch handling + spacing */
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999999 !important; /* Maximum Viewport Priority Layer */
            
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(255, 8, 68, 0.5);
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .float-btn-top:active {
            transform: translateX(-50%) scale(0.92);
        }

        /* -------------------------------------------------------------
           2. BOTTOM FLOATING BUTTON (Sabse Upar Bottom Par Float Karega)
        ------------------------------------------------------------- */
        .float-btn-bottom {
            position: fixed;
            bottom: env(safe-area-inset-bottom, 20px); /* iOS Bottom Bar handling */
            left: 50%;
            transform: translateX(-50%);
            z-index: 999999999 !important; /* Maximum Viewport Priority Layer */
            
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.5);
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .float-btn-bottom:active {
            transform: translateX(-50%) scale(0.92);
        }

        /* Demo Page Content */
        .content-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- TOP FLOATING OVERLAY BUTTON -->
    <button class="float-btn-top" onclick="alert('Top Float Triggered!')">
        ⚡ TOP OVERLAY FLOAT
    </button>

    <!-- DEMO PAGE SCROLL CONTENT -->
    <div class="content-box">
        <h2>Floating Elements Demo</h2>
        <p>Aap page ko kitna bhi scroll karenge, yeh dono buttons browser ke baki saare components ke upar float karte rahenge.</p>
    </div>

    <div class="content-box" style="margin-top: 300px;">
        <h3>Middle Section</h3>
        <p>Yeh section dikhata hai ki background scroll hone ke bawajood floating buttons fixed rahte hain.</p>
    </div>

    <!-- BOTTOM FLOATING OVERLAY BUTTON -->
    <button class="float-btn-bottom" onclick="alert('Bottom Float Triggered!')">
        🚀 BOTTOM OVERLAY FLOAT
    </button>

</body>
</html>
