<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Prefetch Loader</title>

    <!-- 1. Background me Remote Server se Connection Establish karta hai -->
    <link rel="dns-prefetch" href="http://www.matsushima.or.jp">
    <link rel="preconnect" href="http://www.matsushima.or.jp">

    <!-- 2. Site ke Main Document/Assets ko Browser Cache me fetch karke rakh leta hai -->
    <link rel="prefetch" href="http://www.matsushima.or.jp" as="document">

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
        }

        .card {
            text-align: center;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 28px;
            background-color: #008cba;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #005f7f;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Prefetched Remote Site</h2>
        <p>Site background me cache ho chuki hai. Open karne par turant khulegi.</p>
        
        <!-- Direct Link Button -->
        <a href="http://www.matsushima.or.jp" target="_blank" class="btn">View This Site</a>
    </div>

</body>
</html>
